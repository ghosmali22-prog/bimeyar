<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bimeyar</title>
<meta name="description" content="Car insurance case files and documents, connected to Google Drive">
<meta name="theme-color" content="#e9e6f7">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bimeyar">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@400;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<div class="shell glass" id="app">
  <header class="top">
    <a class="brand" data-act="go" data-view="dash" href="#">
      <span class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M8.500 12l2.500 2.500 4.500-5"/></svg></span>
      <span><b data-i18n="brand">Bimeyar</b><small data-i18n="tagline"></small></span>
    </a>
    <nav class="nav" id="nav">
      <i class="nav-ind"></i>
      <button data-act="go" data-view="dash" data-i18n="nav.dash"></button>
      <button data-act="go" data-view="files" data-i18n="nav.files"></button>
      <button data-act="go" data-view="exp" data-i18n="nav.exp"></button>
      <button data-act="go" data-view="inv" data-i18n="nav.invoices"></button>
    </nav>
    <div class="tools">
      <button class="pill-btn as-btn" data-act="assistant" data-i18n-title="assistant"><span data-ico="sparkle"></span><span class="lbl" data-i18n="assistant"></span></button>
      <button class="pill-btn" data-act="settings" id="storeChip" data-i18n-title="store.tip"><span data-ico="cloud"></span><span class="lbl" id="storeLbl">…</span><i class="dot" id="storeDot"></i></button>
      <select class="pill-btn lang" id="langSel" data-i18n-title="set.lang"></select>
      <button class="icon-btn" data-act="settings" data-i18n-title="settings"><span data-ico="sliders"></span></button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar glass" id="tabbar">
  <button data-act="go" data-view="dash"><span data-ico="grid"></span><small data-i18n="nav.dash"></small></button>
  <button data-act="go" data-view="files"><span data-ico="folder"></span><small data-i18n="nav.files"></small></button>
  <button class="tab-add" data-act="add" data-need="edit" data-i18n-title="add.title"><span data-ico="plus"></span></button>
  <button data-act="go" data-view="exp"><span data-ico="clock"></span><small data-i18n="nav.exp"></small></button>
  <button data-act="go" data-view="inv"><span data-ico="invoice"></span><small data-i18n="nav.invoices"></small></button>
</nav>

<div id="drop" class="drop-overlay"><div><span data-ico="download"></span><b data-i18n="drop.title"></b><small data-i18n="drop.sub"></small></div></div>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<div id="print-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
