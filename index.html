<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bimeyar</title>
<meta name="description" content="RICH INSURANS car insurance case files, invoices and renewals">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bimeyar">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Main">
    <div class="brand"><span class="logo"><span data-ico="shield" data-s="20"></span></span><span><b data-i18n="brand">Bimeyar</b><small>RICH INSURANS</small></span></div>
    <nav class="side-nav">
      <button data-act="tab" data-tab="customers"><span data-ico="users"></span><span data-i18n="nav.customers"></span></button>
      <button data-act="tab" data-tab="expiring"><span data-ico="clock"></span><span data-i18n="nav.expiring"></span></button>
      <button data-act="tab" data-tab="invoices"><span data-ico="invoice"></span><span data-i18n="nav.invoices"></span></button>
      <button data-act="tab" data-tab="settings"><span data-ico="cog"></span><span data-i18n="nav.settings"></span></button>
    </nav>
    <button class="btn primary block side-add" data-act="add" data-need="edit"><span data-ico="plus" data-s="20"></span><span data-i18n="add.title"></span></button>
    <div class="side-who" id="sideWho"></div>
  </aside>
  <main id="view" class="view"></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Main">
  <button data-act="tab" data-tab="customers"><span data-ico="users"></span><small data-i18n="nav.customers"></small></button>
  <button data-act="tab" data-tab="expiring"><span data-ico="clock"></span><small data-i18n="nav.expiring"></small></button>
  <button class="tab-add" data-act="add" data-need="edit" data-i18n-title="add.title"><span data-ico="plus" data-s="26"></span></button>
  <button data-act="tab" data-tab="invoices"><span data-ico="invoice"></span><small data-i18n="nav.invoices"></small></button>
  <button data-act="tab" data-tab="settings"><span data-ico="cog"></span><small data-i18n="nav.settings"></small></button>
</nav>

<div id="drop" class="drop-overlay"><div><span data-ico="download" data-s="34"></span><b data-i18n="drop.title"></b><small data-i18n="drop.sub"></small></div></div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="print-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
